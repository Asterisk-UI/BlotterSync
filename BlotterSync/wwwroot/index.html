<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlotterSync - Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .auth-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin-top: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #004494; }
        .toggle-link { color: #0056b3; cursor: pointer; margin-top: 15px; display: block; font-size: 0.9em; text-decoration: underline; }
        #errorMsg, #successMsg { font-size: 0.9em; display: none; margin-top: 10px; }
        #errorMsg { color: red; }
        #successMsg { color: green; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2 id="formTitle">BlotterSync Login</h2>
        
        <!-- LOGIN FORM -->
        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- REGISTER FORM (Hidden by default) -->
        <form id="registerForm" class="hidden">
            <input type="text" id="regBadge" placeholder="Badge Number (e.g., PO1-999)" required>
            <input type="text" id="regFirst" placeholder="First Name" required>
            <input type="text" id="regLast" placeholder="Last Name" required>
            <input type="text" id="regUser" placeholder="Choose Username" required>
            <input type="password" id="regPass" placeholder="Choose Password (min. 8 characters)" minlength="8" required>
            <button type="submit">Register Account</button>
        </form>

        <p id="errorMsg"></p>
        <p id="successMsg"></p>
        <span class="toggle-link" id="toggleMode">Need an account? Register here</span>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5180';

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('formTitle');
        const toggleBtn = document.getElementById('toggleMode');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        // Toggle between Login and Register views
        let isLogin = true;
        toggleBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            if (isLogin) {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                formTitle.innerText = "BlotterSync Login";
                toggleBtn.innerText = "Need an account? Register here";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                formTitle.innerText = "Create Officer Account";
                toggleBtn.innerText = "Already have an account? Login here";
            }
        });

        // Handle Login Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/Auth/Login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('jwtToken', data.token);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.innerText = "Invalid username or password.";
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.innerText = "Cannot connect to the API.";
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Handle Registration Submission
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const payload = {
                badgeNumber: document.getElementById('regBadge').value,
                firstName: document.getElementById('regFirst').value,
                lastName: document.getElementById('regLast').value,
                username: document.getElementById('regUser').value,
                password: document.getElementById('regPass').value
            };
            const submitBtn = registerForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/Auth/Register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    successMsg.innerText = "Account created! You can now log in.";
                    successMsg.style.display = 'block';
                    registerForm.reset();
                    toggleBtn.click(); // Switch back to login view automatically
                } else {
                    let errText = '';
                    const contentType = response.headers.get('content-type') || '';
                    if (contentType.includes('json')) {
                        const errData = await response.json();
                        if (errData && errData.errors) {
                            errText = Object.values(errData.errors).flat().join(' ');
                        } else if (typeof errData === 'string') {
                            errText = errData;
                        } else if (errData && errData.title) {
                            errText = errData.title;
                        }
                    } else {
                        errText = await response.text();
                    }
                    errorMsg.innerText = errText || "Registration failed.";
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.innerText = "Cannot connect to the API.";
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
    <script src="sync-status.js"></script>
</body>
</html>
